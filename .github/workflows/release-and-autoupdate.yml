name: Build & Publish Uv Link (.APK + .EXE + Auto-Updater Release)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pc-exe-with-autoupdater:
    name: Build Windows PC .EXE + electron-updater (latest.yml)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web Studio
        run: |
          npm install
          npm run build

      - name: Upload Windows .EXE & Auto-Updater Metadata
        uses: actions/upload-artifact@v4
        with:
          name: UvLink-PC-Windows-EXE
          path: |
            dist/*
          if-no-files-found: ignore

  build-android-tv-apk:
    name: Build Android TV Receiver (.APK) + OTA Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate OTA Version Manifest (version.json)
        run: |
          mkdir -p dist-ota
          echo '{"version": "2.5.0", "apkAsset": "UvLink-TV-Receiver.apk", "exeAsset": "UvLink-PC-Sender-Setup.exe", "minLatencyMs": 13.6, "releasedAt": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}' > dist-ota/version.json

      - name: Upload OTA Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UvLink-OTA-Manifest
          path: dist-ota/version.json
